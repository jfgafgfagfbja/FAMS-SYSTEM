<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Chi tiết bảng CSDL - FAMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#f4f6f8;color:#1f2937}
nav.top{display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px;background:#0f2a3d}

.lay{display:flex;flex-wrap:wrap} aside{flex:0 0 270px;background:#fff;border-right:1px solid #e2e8f0;padding:14px;min-height:calc(100vh - 52px)}
aside .g{font-size:11px;font-weight:800;letter-spacing:.04em;margin:14px 6px 6px} aside button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:#334155}
aside button:hover{background:#f1f5f9} aside button.on{background:#e0f2f1;font-weight:700;color:#0f766e}
main{flex:1;min-width:0;padding:22px 28px;overflow-x:auto} .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .tag{padding:3px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:700}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px;margin:10px 0 18px} th,td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left;vertical-align:top} td:nth-child(-n+3){white-space:nowrap} td:nth-child(4){overflow-wrap:anywhere;min-width:160px} th{background:#f1f5f9}

<script>
const TB=[{"vn": "users", "en": "models.User", "title": "Người dùng", "group": "Tài khoản & bảo mật", "color": "#2563eb", "desc": "Tài khoản đăng nhập của cả 9 vai trò (admin, cán bộ phòng ban, giảng viên, sinh viên, phụ huynh). Hồ sơ chi tiết nằm ở staff / lecturers / students / parents.", "store": "D1", "cols": [["id", "User.id", "INTEGER", "PK", "Mã người dùng"], ["email", "User.email", "VARCHAR(255)", "UQ NN", "Email đăng nhập, không trùng"], ["password_hash", "User.password_hash", "VARCHAR(255)", "NN", "Mật khẩu đã băm bcrypt, không lưu mật khẩu thô"], ["role", "User.role", "VARCHAR(20)", "NN", "admin | training_office | student_affairs | faculty_office | faculty_leader | board | lecturer | student | parent"], ["full_name", "User.full_name", "VARCHAR(255)", "NN", "Họ và tên"], ["credentials_changed_at", "User.credentials_changed_at", "TIMESTAMP WITHOUT TIME ZONE", "", "Thời điểm đổi / đặt lại mật khẩu gần nhất (đối soát)"], ["token_version", "User.token_version", "INTEGER", "NN", "Tăng mỗi lần đổi mật khẩu; access token mang claim tv khác giá trị này bị từ chối"]], "cons": [], "fkOut": [], "fkIn": [["refresh_tokens", "user_id"], ["password_resets", "user_id"], ["staff", "user_id"], ["lecturers", "user_id"], ["students", "user_id"], ["parents", "user_id"], ["attendance_audits", "changed_by"], ["notifications", "user_id"], ["audit_logs", "actor_id"]], "used": [["PH1. Xác thực & tài khoản", "RW"], ["PH2. Danh mục hệ thống", "W"], ["PH3. Đào tạo", "W"], ["PH4. Người học", "W"]], "ddl": "CREATE TABLE users (\n  id SERIAL NOT NULL,  -- Mã người dùng\n  email VARCHAR(255) NOT NULL,  -- Email đăng nhập, không trùng\n  password_hash VARCHAR(255) NOT NULL,  -- Mật khẩu đã băm bcrypt, không lưu mật khẩu thô\n  role VARCHAR(20) NOT NULL,  -- admin | training_office | student_affairs | faculty_office | faculty_leader | board | lecturer | student | parent\n  full_name VARCHAR(255) NOT NULL,  -- Họ và tên\n  credentials_changed_at TIMESTAMP WITHOUT TIME ZONE,  -- Thời điểm đổi / đặt lại mật khẩu gần nhất (đối soát)\n  token_version INTEGER DEFAULT '0' NOT NULL,  -- Tăng mỗi lần đổi mật khẩu; access token mang claim tv khác giá trị này bị từ chối\n  PRIMARY KEY (id),\n  UNIQUE (email)\n);\nCOMMENT ON TABLE users IS 'Người dùng: Tài khoản đăng nhập của cả 9 vai trò (admin, cán bộ phòng ban, giảng viên, sinh viên, phụ huynh). Hồ sơ chi tiết nằm ở staff / lecturers / students / parents.';\nCOMMENT ON COLUMN users.id IS 'Mã người dùng';\nCOMMENT ON COLUMN users.email IS 'Email đăng nhập, không trùng';\nCOMMENT ON COLUMN users.password_hash IS 'Mật khẩu đã băm bcrypt, không lưu mật khẩu thô';\nCOMMENT ON COLUMN users.role IS 'admin | training_office | student_affairs | faculty_office | faculty_leader | board | lecturer | student | parent';\nCOMMENT ON COLUMN users.full_name IS 'Họ và tên';\nCOMMENT ON COLUMN users.credentials_changed_at IS 'Thời điểm đổi / đặt lại mật khẩu gần nhất (đối soát)';\nCOMMENT ON COLUMN users.token_version IS 'Tăng mỗi lần đổi mật khẩu; access token mang claim tv khác giá trị này bị từ chối';"}, {"vn": "refresh_tokens", "en": "models.RefreshToken", "title": "Refresh token", "group": "Tài khoản & bảo mật", "color": "#2563eb", "desc": "Refresh token (30 ngày) của app. Chỉ lưu SHA-256; mỗi lần làm mới thì xoay vòng sang token mới. Dùng lại token đã thu hồi ⇒ thu hồi toàn bộ token của tài khoản.", "store": "D1", "cols": [["id", "RefreshToken.id", "INTEGER", "PK", "Mã"], ["user_id", "RefreshToken.user_id", "INTEGER", "FK:users NN", "Tài khoản sở hữu"], ["token_hash", "RefreshToken.token_hash", "VARCHAR(64)", "UQ NN", "SHA-256 của refresh token"], ["expires_at", "RefreshToken.expires_at", "TIMESTAMP WITHOUT TIME ZONE", "NN", "Hết hạn (UTC)"], ["revoked_at", "RefreshToken.revoked_at", "TIMESTAMP WITHOUT TIME ZONE", "", "Thời điểm thu hồi (UTC), NULL = còn hiệu lực"]], "cons": [], "fkOut": [["user_id", "users", false]], "fkIn": [], "used": [["PH1. Xác thực & tài khoản", "W"]], "ddl": "CREATE TABLE refresh_tokens (\n  id SERIAL NOT NULL,  -- Mã\n  user_id INTEGER NOT NULL,  -- Tài khoản sở hữu\n  token_hash VARCHAR(64) NOT NULL,  -- SHA-256 của refresh token\n  expires_at TIMESTAMP WITHOUT TIME ZONE NOT NULL,  -- Hết hạn (UTC)\n  revoked_at TIMESTAMP WITHOUT TIME ZONE,  -- Thời điểm thu hồi (UTC), NULL = còn hiệu lực\n  PRIMARY KEY (id),\n  FOREIGN KEY(user_id) REFERENCES users (id),\n  UNIQUE (token_hash)\n);\nCOMMENT ON TABLE refresh_tokens IS 'Refresh token: Refresh token (30 ngày) của app. Chỉ lưu SHA-256; mỗi lần làm mới thì xoay vòng sang token mới. Dùng lại token đã thu hồi ⇒ thu hồi toàn bộ token của tài khoản.';\nCOMMENT ON COLUMN refresh_tokens.id IS 'Mã';\nCOMMENT ON COLUMN refresh_tokens.user_id IS 'Tài khoản sở hữu';\nCOMMENT ON COLUMN refresh_tokens.token_hash IS 'SHA-256 của refresh token';\nCOMMENT ON COLUMN refresh_tokens.expires_at IS 'Hết hạn (UTC)';\nCOMMENT ON COLUMN refresh_tokens.revoked_at IS 'Thời điểm thu hồi (UTC), NULL = còn hiệu lực';"}, {"vn": "revoked_tokens", "en": "models.RevokedToken", "title": "Access token bị thu hồi", "group": "Tài khoản & bảo mật", "color": "#2563eb", "desc": "Danh sách đen access token (JWT) bị thu hồi trước hạn khi đăng xuất; kiểm tra mỗi request theo jti.", "store": "D1", "cols": [["id", "RevokedToken.id", "INTEGER", "PK", "Mã"], ["jti", "RevokedToken.jti", "VARCHAR(36)", "UQ NN", "Mã định danh JWT (claim jti)"], ["expires_at", "RevokedToken.expires_at", "TIMESTAMP WITHOUT TIME ZONE", "NN", "Hết hạn của token (UTC)"]], "cons": [], "fkOut": [], "fkIn": [], "used": [["PH1. Xác thực & tài khoản", "RW"]], "ddl": "CREATE TABLE revoked_tokens (\n  id SERIAL NOT NULL,  -- Mã\n  jti VARCHAR(36) NOT NULL,  -- Mã định danh JWT (claim jti)\n  expires_at TIMESTAMP WITHOUT TIME ZONE NOT NULL,  -- Hết hạn của token (UTC)\n  PRIMARY KEY (id),\n  UNIQUE (jti)\n);\nCOMMENT ON TABLE revoked_tokens IS 'Access token bị thu hồi: Danh sách đen access token (JWT) bị thu hồi trước hạn khi đăng xuất; kiểm tra mỗi request theo jti.';\nCOMMENT ON COLUMN revoked_tokens.id IS 'Mã';\nCOMMENT ON COLUMN revoked_tokens.jti IS 'Mã định danh JWT (claim jti)';\nCOMMENT ON COLUMN revoked_tokens.expires_at IS 'Hết hạn của token (UTC)';"}, {"vn": "password_resets", "en": "models.PasswordReset", "title": "Yêu cầu đặt lại mật khẩu", "group": "Tài khoản & bảo mật", "color": "#2563eb", "desc": "Mã OTP 6 số gửi qua email khi quên mật khẩu; chỉ lưu bản băm, hết hạn sau 10 phút, dùng một lần.", "store": "D1", "cols": [["id", "PasswordReset.id", "INTEGER", "PK", "Mã"], ["user_id", "PasswordReset.user_id", "INTEGER", "FK:users NN", "Tài khoản"], ["otp_hash", "PasswordReset.otp_hash", "VARCHAR(255)", "NN", "OTP đã băm bcrypt"], ["expires_at", "PasswordReset.expires_at", "TIMESTAMP WITHOUT TIME ZONE", "NN", "Hết hạn (UTC)"], ["used", "PasswordReset.used", "BOOLEAN", "NN", "Đã dùng"], ["created_at", "PasswordReset.created_at", "TIMESTAMP WITHOUT TIME ZONE", "NN", "Thời điểm yêu cầu"]], "cons": [], "fkOut": [["user_id", "users", false]], "fkIn": [], "used": [["PH1. Xác thực & tài khoản", "RW"]], "ddl": "CREATE TABLE password_resets (\n  id SERIAL NOT NULL,  -- Mã\n  user_id INTEGER NOT NULL,  -- Tài khoản\n  otp_hash VARCHAR(255) NOT NULL,  -- OTP đã băm bcrypt\n  expires_at TIMESTAMP WITHOUT TIME ZONE NOT NULL,  -- Hết hạn (UTC)\n  used BOOLEAN NOT NULL,  -- Đã dùng\n  created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT now() NOT NULL,  -- Thời điểm yêu cầu\n  PRIMARY KEY (id),\n  FOREIGN KEY(user_id) REFERENCES users (id)\n);\nCOMMENT ON TABLE password_resets IS 'Yêu cầu đặt lại mật khẩu: Mã OTP 6 số gửi qua email khi quên mật khẩu; chỉ lưu bản băm, hết hạn sau 10 phút, dùng một lần.';\nCOMMENT ON COLUMN password_resets.id IS 'Mã';\nCOMMENT ON COLUMN password_resets.user_id IS 'Tài khoản';\nCOMMENT ON COLUMN password_resets.otp_hash IS 'OTP đã băm bcrypt';\nCOMMENT ON COLUMN password_resets.expires_at IS 'Hết hạn (UTC)';\nCOMMENT ON COLUMN password_resets.used IS 'Đã dùng';\nCOMMENT ON COLUMN password_resets.created_at IS 'Thời điểm yêu cầu';"}, {"vn": "units", "en": "models.Unit", "title": "Đơn vị", "group": "Tổ chức & danh mục", "color": "#475569", "desc": "Đơn vị trong trường: Khoa, Phòng Đào tạo, Phòng Công tác SV, Ban ngành. Loại đơn vị quyết định vai trò cán bộ.", "store": "D2", "cols": [["id", "Unit.id", "INTEGER", "PK", "Mã đơn vị"], ["code", "Unit.code", "VARCHAR(30)", "UQ NN", "Mã viết tắt, không trùng"], ["name", "Unit.name", "VARCHAR(255)", "NN", "Tên đơn vị"], ["type", "Unit.type", "VARCHAR(20)", "NN", "faculty | training | student_affairs | board (không đổi sau khi tạo)"]], "cons": [], "fkOut": [], "fkIn": [["staff", "unit_id"], ["lecturers", "faculty_id"], ["classes", "faculty_id"], ["students", "faculty_id"], ["audit_logs", "faculty_id"]], "used": [["PH2. Danh mục hệ thống", "RW"], ["PH8. Báo cáo, thống kê", "R"]], "ddl": "CREATE TABLE units (\n  id SERIAL NOT NULL,  -- Mã đơn vị\n  code VARCHAR(30) NOT NULL,  -- Mã viết tắt, không trùng\n  name VARCHAR(255) NOT NULL,  -- Tên đơn vị\n  type VARCHAR(20) NOT NULL,  -- faculty | training | student_affairs | board (không đổi sau khi tạo)\n  PRIMARY KEY (id),\n  UNIQUE (code)\n);\nCOMMENT ON TABLE units IS 'Đơn vị: Đơn vị trong trường: Khoa, Phòng Đào tạo, Phòng Công tác SV, Ban ngành. Loại đơn vị quyết định vai trò cán bộ.';\nCOMMENT ON COLUMN units.id IS 'Mã đơn vị';\nCOMMENT ON COLUMN units.code IS 'Mã viết tắt, không trùng';\nCOMMENT ON COLUMN units.name IS 'Tên đơn vị';\nCOMMENT ON COLUMN units.type IS 'faculty | training | student_affairs | board (không đổi sau khi tạo)';"}, {"vn": "staff", "en": "models.Staff", "title": "Cán bộ phòng ban", "group": "Tổ chức & danh mục", "color": "#475569", "desc": "Hồ sơ cán bộ: mỗi tài khoản thuộc đúng một đơn vị. Đơn vị loại Khoa có hai vai trò: Văn phòng Khoa / Lãnh đạo Khoa.", "store": "D1", "cols": [["id", "Staff.id", "INTEGER", "PK", "Mã cán bộ"], ["user_id", "Staff.user_id", "INTEGER", "FK:users UQ NN", "Tài khoản (1 : 1)"], ["unit_id", "Staff.unit_id", "INTEGER", "FK:units NN", "Đơn vị công tác" nCOMMENT ON COLUMN audit_logs.success IS 'Thành công / thất bại';\nCOMMENT ON COLUMN audit_logs.detail IS 'Chi tiết JSON {trường: [cũ, mới]}';"}];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let cur=0;
function side(){let h='',g='';TB.forEach((t,i)=>{if(t.group!==g){g=t.group;h+=`<div class="g" style="color:${t.color}">${g.toUpperCase()}</div>`}h+=`<button class="${i===cur?'on':''}" onclick="go(${i})">${t.vn}</button>`});document.getElementById('side').innerHTML=h}
function keys(k){return k.split(' ').filter(Boolean).map(x=>{const n=x.startsWith('FK')?'FK':x;const ref=x.includes(':')?' → '+x.split(':')[1]:'';return `<span class="k ${n}">${n}${ref}</span>`}).join('')}
function show(){const t=TB[cur];let h=`<div class="hd"><h1>${t.vn}</h1><span class="tag" style="background:${t.color}">${t.group}</span><span style="color:#64748b">tên trong chương trình: <code>${esc(t.en)}</code> · kho DFD: <b>${t.store}</b></span></div><p><b>${t.title}</b> — ${t.desc}</p>`;
h+='<h3>Các cột</h3><table><tr><th>#</th><th>Tên cột</th><th>Tên trường (code)</th><th>Kiểu dữ liệu</th><th>Khóa / ràng buộc</th><th>Mô tả</th></tr>';
t.cols.forEach((c,i)=>{h+=`<tr><td>${i+1}</td><td><b>${c[0]}</b></td><td><code>${esc(c[1])}</code></td><td>${esc(c[2])}</td><td>${keys(c[3])}</td><td>${c[4]}</td></tr>`});h+='</table>';
if(t.cons.length)h+='<p><b>Ràng buộc bảng:</b> '+t.cons.map(x=>`<code>${x}</code>`).join(' ')+'</p>';
h+='<h3>Quan hệ</h3><table><tr><th>Hướng</th><th>Bảng liên quan</th><th>Cột</th><th>Bản số</th></tr>';
t.fkOut.forEach(r=>{h+=`<tr><td>Tham chiếu tới</td><td><a href="#${r[1]}" onclick="goName('${r[1]}')">${r[1]}</a></td><td>${r[0]}</td><td>N : 1${r[2]?' (không bắt buộc)':''}</td></tr>`});
t.fkIn.forEach(r=>{h+=`<tr><td>Được tham chiếu bởi</td><td><a href="#${r[0]}" onclick="goName('${r[0]}')">${r[0]}</a></td><td>${r[1]}</td><td>1 : N</td></tr>`});
if(!t.fkOut.length&&!t.fkIn.length)h+='<tr><td colspan="4">Không có</td></tr>';h+='</table>';
h+='<h3>Được dùng trong các quy trình (R = đọc, W = ghi)</h3>'+(t.used.length?t.used.map(u=>`<span class="u"><b>${u[0]}</b> · ${u[1].split('').join('/')}</span>`).join(''):'<i>Chưa gắn với quy trình nào</i>');
h+='<h3>Câu lệnh tạo bảng (PostgreSQL 16)</h3><pre>'+esc(t.ddl)+'</pre>';document.getElementById('main').innerHTML=h}
function go(i){cur=i;history.replaceState(null,'','#'+TB[i].vn);side();show();window.scrollTo(0,0)}
function goName(n){const i=TB.findIndex(t=>t.vn===n);if(i>=0)go(i)}
const h0=location.hash.slice(1);const i0=TB.findIndex(t=>t.vn===h0);cur=i0>=0?i0:0;side();show();
window.addEventListener('hashchange',()=>{const i=TB.findIndex(t=>t.vn===location.hash.slice(1));if(i>=0){cur=i;side();show()}});
</script></body></html>
